# SUMMA manifest for multi-case simulations
#
# This file defines the cases included in a multi-case simulation and
# controls how those cases are distributed across compute resources.
# Each case uses the common SUMMA configuration template specified below.

[multi_case]

# User-configurable settings
# --------------------------

# if the path to the template file is not provided then it is assumed
# that the template file is in the same directory as the manifest

template_file = "summa_config_template.toml"

cases_per_node = 4

# Simulation cases
# ----------------

case_names = [
  "CAN_01AD003",
  "CAN_01AM001",
  "CAN_01BJ010",
  "CAN_01DG003",
  "CAN_01FB001",
  "CAN_02BA003",
  "CAN_02DD015",
  "CAN_02FB010"
]
