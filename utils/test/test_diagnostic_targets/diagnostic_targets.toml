# Add these explicit target blocks to the existing exp50 configuration.
# Keep algorithm = "dds" in the existing [calibration] section.
# Keep the existing parameter sections, dates, paths and model decisions.
# When explicit targets are present, the legacy implicit KGE target is NOT added.

[[calibration.target]]
name          = "streamflow_kge"
variable      = "streamflow"
obs_path      = "{home}/data/camels-spat/observations/obs-daily/"
obs_file      = "{case_name}_daily_flow_observations.nc"
vname_obs     = "q_obs"
metric        = "kge"
obs_transform = "none"
weight        = 1.0

[[calibration.target]]
name          = "streamflow_nse_log"
variable      = "streamflow"
obs_path      = "{home}/data/camels-spat/observations/obs-daily/"
obs_file      = "{case_name}_daily_flow_observations.nc"
vname_obs     = "q_obs"
metric        = "nse"
obs_transform = "log"
weight        = 0.0
